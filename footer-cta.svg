<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="200" viewBox="0 0 1000 200">
  <defs>
    <linearGradient id="bg-footer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="100%" style="stop-color:#161B22"/>
    </linearGradient>
    <linearGradient id="accent-footer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6C63FF"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="200" fill="url(#bg-footer)" rx="10"/>

  <!-- Animated top border -->
  <rect x="0" y="0" width="1000" height="3" rx="1" fill="url(#accent-footer)">
    <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Floating particles -->
  <circle cx="100" cy="60" r="2" fill="#6C63FF" opacity="0.4">
    <animate attributeName="cy" values="60;40;60" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="300" cy="150" r="1.5" fill="#A855F7" opacity="0.3">
    <animate attributeName="cy" values="150;130;150" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="700" cy="80" r="2" fill="#6C63FF" opacity="0.4">
    <animate attributeName="cy" values="80;60;80" dur="3.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;0.6;0.2" dur="3.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="900" cy="140" r="1.5" fill="#A855F7" opacity="0.3">
    <animate attributeName="cy" values="140;120;140" dur="4.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.5;0.1" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="50" r="1.5" fill="#FFFFFF" opacity="0.2">
    <animate attributeName="cy" values="50;35;50" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.1;0.3;0.1" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- Main CTA text -->
  <text x="500" y="75" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="28" font-weight="700" fill="#E6EDF3" text-anchor="middle" letter-spacing="1">
    Let's Build Something Amazing Together
  </text>

  <!-- Subtitle -->
  <text x="500" y="110" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="15" fill="#8B949E" text-anchor="middle">
    Open for collaborations • Freelance work • Open source contributions
  </text>

  <!-- Animated email pill -->
  <g opacity="0.9">
    <rect x="350" y="130" width="300" height="40" rx="20" fill="none" stroke="url(#accent-footer)" stroke-width="2">
      <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
    </rect>
    <text x="500" y="156" font-family="'Fira Code', monospace" font-size="14" fill="#6C63FF" text-anchor="middle" font-weight="600">
      📧 rishabhtiwari3538@gmail.com
    </text>
  </g>
</svg>
