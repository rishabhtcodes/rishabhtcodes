<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="120" viewBox="0 0 1000 120">
  <style>
    .bg { fill: #ffffff; stroke: #e1e4e8; stroke-width: 1; }
    .title { fill: #24292e; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; }
    .subtitle { fill: #586069; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .accent { fill: #0366d6; }
    .pill-bg { fill: #f6f8fa; stroke: #d1d5da; stroke-width: 1; }
    .pill-text { fill: #0366d6; font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; font-weight: 600; }

    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; stroke: #30363d; }
      .title { fill: #c9d1d9; }
      .subtitle { fill: #8b949e; }
      .accent { fill: #58a6ff; }
      .pill-bg { fill: #161b22; stroke: #30363d; }
      .pill-text { fill: #58a6ff; }
    }
  </style>

  <!-- Card Background -->
  <rect class="bg" width="1000" height="120" rx="8"/>

  <!-- Left Accent Line -->
  <rect class="accent" x="0" y="0" width="5" height="120" rx="2"/>

  <!-- Main Title -->
  <text class="title" x="40" y="48" font-size="22">Let's Build Something Amazing Together</text>

  <!-- Subtitle -->
  <text class="subtitle" x="40" y="78" font-size="14">Open for collaborations • Freelance work • Open source contributions</text>

  <!-- Email Pill on the Right -->
  <g transform="translate(680, 42)">
    <rect class="pill-bg" width="280" height="36" rx="18"/>
    <text class="pill-text" x="140" y="23" font-size="13" text-anchor="middle">📧 rishabhtiwari3538@gmail.com</text>
  </g>
</svg>
