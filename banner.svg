<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117"/>
      <stop offset="50%" style="stop-color:#161B22"/>
      <stop offset="100%" style="stop-color:#0D1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6C63FF"/>
      <stop offset="50%" style="stop-color:#A855F7"/>
      <stop offset="100%" style="stop-color:#6C63FF"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6C63FF;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#6C63FF;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#6C63FF;stop-opacity:0"/>
    </linearGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="20"/>
    </filter>
    <filter id="softglow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="300" fill="url(#bg)"/>

  <!-- Animated floating orbs -->
  <circle cx="150" cy="80" r="60" fill="#6C63FF" opacity="0.08" filter="url(#blur)">
    <animate attributeName="cx" values="150;200;150" dur="8s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="80;120;80" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="800" cy="200" r="80" fill="#A855F7" opacity="0.06" filter="url(#blur)">
    <animate attributeName="cx" values="800;750;800" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="200;160;200" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="150" r="50" fill="#6C63FF" opacity="0.05" filter="url(#blur)">
    <animate attributeName="cx" values="500;550;500" dur="9s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="150;100;150" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- Grid pattern dots -->
  <g opacity="0.15">
    <circle cx="50" cy="50" r="1.5" fill="#6C63FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="50" r="1.5" fill="#6C63FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="50" r="1.5" fill="#6C63FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="100" r="1.5" fill="#6C63FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="100" r="1.5" fill="#6C63FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="100" r="1.5" fill="#6C63FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="50" r="1.5" fill="#A855F7"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="50" r="1.5" fill="#A855F7"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="50" r="1.5" fill="#A855F7"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="100" r="1.5" fill="#A855F7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="100" r="1.5" fill="#A855F7"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="100" r="1.5" fill="#A855F7"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="200" r="1.5" fill="#A855F7"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="200" r="1.5" fill="#A855F7"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="200" r="1.5" fill="#A855F7"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="200" r="1.5" fill="#6C63FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="200" r="1.5" fill="#6C63FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="200" r="1.5" fill="#6C63FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="50" cy="250" r="1.5" fill="#6C63FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite"/></circle>
    <circle cx="100" cy="250" r="1.5" fill="#6C63FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="150" cy="250" r="1.5" fill="#6C63FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="850" cy="250" r="1.5" fill="#A855F7"><animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="250" r="1.5" fill="#A855F7"><animate attributeName="opacity" values="0.3;1;0.3" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="950" cy="250" r="1.5" fill="#A855F7"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.5s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Animated code brackets -->
  <text x="60" y="160" font-family="Fira Code, monospace" font-size="80" fill="#6C63FF" opacity="0.12">
    &lt;/&gt;
    <animate attributeName="opacity" values="0.06;0.15;0.06" dur="4s" repeatCount="indefinite"/>
  </text>
  <text x="820" y="180" font-family="Fira Code, monospace" font-size="60" fill="#A855F7" opacity="0.1">
    { }
    <animate attributeName="opacity" values="0.05;0.12;0.05" dur="5s" repeatCount="indefinite"/>
  </text>

  <!-- Main Name -->
  <text x="500" y="110" font-family="'Segoe UI', Ubuntu, sans-serif" font-size="42" font-weight="700" fill="#E6EDF3" text-anchor="middle" letter-spacing="1">
    Rishabh Kumar Tiwari
    <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
  </text>

  <!-- Accent line under name -->
  <rect x="350" y="125" width="300" height="3" rx="2" fill="url(#accent)">
    <animate attributeName="width" values="0;300" dur="1.5s" fill="freeze"/>
    <animate attributeName="x" values="500;350" dur="1.5s" fill="freeze"/>
  </rect>

  <!-- Role text -->
  <text x="500" y="165" font-family="'Fira Code', monospace" font-size="18" fill="#8B949E" text-anchor="middle" letter-spacing="2">
    FULL STACK ENGINEER
    <animate attributeName="opacity" values="0;1" dur="1s" begin="0.5s" fill="freeze"/>
  </text>

  <!-- Tech pills -->
  <g opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.8s" begin="1s" fill="freeze"/>

    <!-- Django pill -->
    <rect x="265" y="185" width="90" height="30" rx="15" fill="#092E20" stroke="#0E4732" stroke-width="1"/>
    <text x="310" y="205" font-family="'Segoe UI', sans-serif" font-size="13" fill="#44B78B" text-anchor="middle" font-weight="600">Django</text>

    <!-- React pill -->
    <rect x="365" y="185" width="80" height="30" rx="15" fill="#1A2332" stroke="#264059" stroke-width="1"/>
    <text x="405" y="205" font-family="'Segoe UI', sans-serif" font-size="13" fill="#61DAFB" text-anchor="middle" font-weight="600">React</text>

    <!-- Vite pill -->
    <rect x="455" y="185" width="70" height="30" rx="15" fill="#1E1A2E" stroke="#3B2D5E" stroke-width="1"/>
    <text x="490" y="205" font-family="'Segoe UI', sans-serif" font-size="13" fill="#646CFF" text-anchor="middle" font-weight="600">Vite</text>

    <!-- Node.js pill -->
    <rect x="535" y="185" width="90" height="30" rx="15" fill="#1A2E1A" stroke="#2D5E2D" stroke-width="1"/>
    <text x="580" y="205" font-family="'Segoe UI', sans-serif" font-size="13" fill="#339933" text-anchor="middle" font-weight="600">Node.js</text>

    <!-- Python pill -->
    <rect x="635" y="185" width="90" height="30" rx="15" fill="#1A1E2E" stroke="#2D3A5E" stroke-width="1"/>
    <text x="680" y="205" font-family="'Segoe UI', sans-serif" font-size="13" fill="#3776AB" text-anchor="middle" font-weight="600">Python</text>
  </g>

  <!-- Education line -->
  <text x="500" y="250" font-family="'Segoe UI', sans-serif" font-size="14" fill="#6C63FF" text-anchor="middle" opacity="0">
    🎓 B.Tech CSE @ Lovely Professional University
    <animate attributeName="opacity" values="0;0.8" dur="0.8s" begin="1.5s" fill="freeze"/>
  </text>

  <!-- Animated bottom border -->
  <rect x="0" y="296" width="1000" height="4" fill="url(#accent)">
    <animate attributeName="x" values="-1000;0" dur="2s" fill="freeze"/>
  </rect>

  <!-- Pulsing corner accents -->
  <circle cx="20" cy="20" r="4" fill="#6C63FF" opacity="0.5">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="20" r="4" fill="#A855F7" opacity="0.5">
    <animate attributeName="r" values="3;5;3" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="20" cy="280" r="4" fill="#A855F7" opacity="0.5">
    <animate attributeName="r" values="3;5;3" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="980" cy="280" r="4" fill="#6C63FF" opacity="0.5">
    <animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.3;0.7;0.3" dur="2s" repeatCount="indefinite"/>
  </circle>
</svg>
