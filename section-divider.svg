<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="12" viewBox="0 0 1000 12">
  <defs>
    <linearGradient id="divider-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1"/>
      <stop offset="15%" style="stop-color:#6C63FF;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#A855F7;stop-opacity:1"/>
      <stop offset="85%" style="stop-color:#6C63FF;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0D1117;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect x="0" y="4" width="1000" height="2" rx="1" fill="url(#divider-gradient)" opacity="0.6"/>
  <!-- Animated glow dot -->
  <circle cy="5" r="4" fill="#A855F7" opacity="0.8">
    <animate attributeName="cx" values="0;1000;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.9;0" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cy="5" r="2" fill="#FFFFFF" opacity="0.6">
    <animate attributeName="cx" values="0;1000;0" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;0.8;0" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
